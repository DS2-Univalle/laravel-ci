name: Laravel CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configurar PHP 8.2
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, curl, fileinfo, json
          coverage: none

      # 3️⃣ Instalar Composer 2 y dependencias
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 4️⃣ Copiar archivo .env
      - name: Copiar .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # 5️⃣ Generar APP_KEY
      - name: Generar APP_KEY
        run: php artisan key:generate

      # 6️⃣ Cachear dependencias (opcional, mejora velocidad)
      - name: Composer install (cached)
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-progress --prefer-dist --optimize-autoloader

      - name: Crear base SQLite
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Migraciones
        run: php artisan migrate --force

      # 7️⃣ Ejecutar pruebas (si las tienes)
      - name: Ejecutar pruebas
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test -q
